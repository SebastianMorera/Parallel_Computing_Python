[project]
name = "parallel-computing-python-course"
version = "0.1.0"
description = "Udemy course: Learn Parrarel Computing in Python"
authors = [
    {name = "Sebastian",email = "sebas.morera999@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.mypy]
strict = true